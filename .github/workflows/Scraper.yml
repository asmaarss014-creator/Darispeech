name: Auto Dari Data Scraper
on:
  schedule:
    - cron: '0 0 * * *' # This runs automatically every day at midnight
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Search YouTube and Download Dari Files
        run: |
          # This command searches YouTube for "Afghanistan Dari news", picks the top 5 results,
          # downloads the audio as 16kHz Mono WAV (perfect for AI), and grabs Persian/Dari subs.
          yt-dlp --ignore-errors \
          "ytsearch5:Afghanistan Dari news" \
          -f "bestaudio/best" \
          -x --audio-format wav \
          --postprocessor-args "-ar 16000 -ac 1" \
          --write-auto-sub --sub-lang "fa,fa-AF,prs" \
          --convert-subs vtt \
          --download-archive archive.txt \
          --match-filter "duration < 900" \
          -o "audio_%(id)s.%(ext)s"

      - name: Save Files to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-scraped Dari data from YouTube search" || echo "No new files to commit"
          git push || echo "Nothing to push"
