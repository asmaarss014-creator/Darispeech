name: Auto Dari Data Scraper
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Search YouTube and Download Dari Files
        run: |
          # Searching TOLOnews and Shamshad News for guaranteed Dari content
          yt-dlp --ignore-errors \
          "ytsearch3:TOLOnews" \
          -f "bestaudio/best" \
          -x --audio-format wav \
          --postprocessor-args "-ar 16000 -ac 1" \
          --write-auto-sub --sub-lang "fa,fa-AF,prs" \
          --convert-subs vtt \
          --download-archive archive.txt \
          -o "audio_%(id)s.%(ext)s"

      - name: Save Files to Repo
        run: |
          echo "Files currently in folder:"
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # This checks if there are any files to commit. If yes, it pushes. If no, it succeeds anyway.
          git commit -m "Auto-scraped Dari data from YouTube search" || echo "No new files to commit, but that's okay."
          git push || echo "Nothing to push, but that's okay."
