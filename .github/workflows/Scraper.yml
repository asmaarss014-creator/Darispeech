name: Dari Data Scraper
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL to download'
        required: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install ffmpeg -y

      - name: Run Scraper
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          python << 'EOF'
          import yt_dlp
          import os

          def download_data(url):
              print(f"Downloading {url}...")
              ydl_opts = {
                  'format': 'bestaudio/best',
                  'outtmpl': 'audio_%(id)s.%(ext)s',
                  'writesubtitles': True,
                  'writeautomaticsub': True,
                  'subtitleslangs': ['fa', 'fa-AF', 'prs'],
                  'subtitlesformat': 'vtt',
              }
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  ydl.download([url])
              print("Done downloading!")

          video_url = os.environ.get('VIDEO_URL')
          if video_url:
              download_data(video_url)
          else:
              print("No URL provided!")
          EOF

      - name: Save Files to Repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-scraped Dari data from YouTube"
          git push
